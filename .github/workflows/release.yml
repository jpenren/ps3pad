name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux nativo + cross macOS only
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: ps3pad-linux-x86_64.tar.gz
            cross_targets: x86_64-apple-darwin aarch64-apple-darwin
            rust_targets: x86_64-apple-darwin aarch64-apple-darwin

          # Windows nativo (MSVC - compila driver KMDF + app)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ps3pad-windows-x86_64.zip
            cross_targets: ''
            rust_targets: ''

          # macOS: un solo job en macos-15 (ARM) que compila AMBOS targets vía Rosetta 2
          - os: macos-15
            target: universal
            artifact: ps3pad-macos-universal.tar.gz
            cross_targets: ''
            rust_targets: x86_64-apple-darwin aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev pkg-config \
            gcc-mingw-w64-x86_64 \
            clang lld llvm

      - name: Install cross (Linux -> Windows/macOS)
        if: runner.os == 'Linux' && matrix.cross_targets != ''
        uses: taiki-e/install-action@cross

      - name: Build native
        if: matrix.target != 'universal'
        run: |
          cargo build --release --target ${{ matrix.target }} --workspace --bins

      - name: Build both macOS targets (on macos-15)
        if: matrix.target == 'universal'
        run: |
          cargo build --release --target x86_64-apple-darwin --workspace --bins
          cargo build --release --target aarch64-apple-darwin --workspace --bins

      - name: Build cross targets (from Linux)
        if: runner.os == 'Linux' && matrix.cross_targets != ''
        run: |
          for t in ${{ matrix.cross_targets }}; do
            cross build --release --target $t --workspace --bins
          done

      - name: Package Linux
        if: runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/ps3pad dist/
          tar czf ${{ matrix.artifact }} -C dist ps3pad
          cp drivers/linux/60-ps3pad.rules dist/
          tar czf ps3pad-linux-udev.tar.gz -C dist 60-ps3pad.rules

      - name: Package Windows (cross from Linux)
        if: runner.os == 'Linux' && contains(matrix.cross_targets, 'x86_64-pc-windows-gnu')
        shell: bash
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-gnu/release/ps3pad.exe dist/
          cp -r drivers/windows dist/ 2>/dev/null || true
          zip -r ${{ matrix.artifact }} dist/*

      - name: Package Windows (native MSVC)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/ps3pad.exe dist/
          cp -r drivers/windows dist/ 2>/dev/null || true
          7z a ${{ matrix.artifact }} dist/*

      - name: Package macOS individual targets + universal
        if: runner.os == 'macOS' && matrix.target == 'universal'
        run: |
          mkdir -p dist
          # Individual binaries
          cp target/x86_64-apple-darwin/release/ps3pad dist/ps3pad-x86_64
          cp target/aarch64-apple-darwin/release/ps3pad dist/ps3pad-aarch64
          tar czf ps3pad-macos-x86_64.tar.gz -C dist ps3pad-x86_64
          tar czf ps3pad-macos-aarch64.tar.gz -C dist ps3pad-aarch64
          # Universal binary
          lipo -create \
            target/x86_64-apple-darwin/release/ps3pad \
            target/aarch64-apple-darwin/release/ps3pad \
            -output dist/ps3pad-universal
          tar czf ${{ matrix.artifact }} -C dist ps3pad-universal

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ps3pad-linux-udev.tar.gz
            ps3pad-macos-x86_64.tar.gz
            ps3pad-macos-aarch64.tar.gz
            ps3pad-macos-universal.tar.gz
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true