name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux nativo. Los targets Apple NO se pueden cross-compilar desde
          # Linux sin el SDK de macOS (osxcross); se construyen en el job macOS.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: ps3pad-linux-x86_64.tar.gz
            rust_targets: ''

          # Windows nativo (MSVC - compila app + empaqueta driver DsHidMini)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ps3pad-windows-x86_64.zip
            rust_targets: ''

          # macOS: un solo job en macos-15 (ARM) que compila AMBOS targets vía Rosetta 2
          - os: macos-15
            target: universal
            artifact: ps3pad-macos-universal.tar.gz
            rust_targets: x86_64-apple-darwin aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      # ubuntu-latest ships a very new glibc (2.43 as of this writing), which
      # makes the resulting binary unusable on older distros. cargo-zigbuild
      # links against Zig's bundled glibc stubs so the release works on
      # glibc >= 2.17 (Debian 10+, Ubuntu 18.04+, etc.).
      - name: Install Zig (Linux, for glibc 2.17 compatibility)
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Install cargo-zigbuild (Linux)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.24.0

      - name: Build Linux (glibc 2.17 compatible)
        if: runner.os == 'Linux'
        run: |
          cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.17 --workspace --bins

      - name: Verify Linux glibc compatibility
        if: runner.os == 'Linux'
        run: |
          max=$(objdump -T target/x86_64-unknown-linux-gnu/release/ps3pad \
            | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          echo "Maximum required glibc symbol: $max"
          version=${max#GLIBC_}
          if dpkg --compare-versions "$version" gt "2.17"; then
            echo "ERROR: binary requires glibc $version, expected <= 2.17" >&2
            exit 1
          fi

      - name: Build native (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo build --release --target ${{ matrix.target }} --workspace --bins

      - name: Build both macOS targets (on macos-15)
        if: matrix.target == 'universal'
        run: |
          # Idempotent: guarantees both std targets exist even if the matrix
          # entry changes. Without them rustc fails with E0463 "can't find
          # crate for `std`".
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          rustup target list --installed
          cargo build --release --target x86_64-apple-darwin --workspace --bins
          cargo build --release --target aarch64-apple-darwin --workspace --bins

      - name: Package Linux
        if: runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/ps3pad dist/
          tar czf ${{ matrix.artifact }} -C dist ps3pad
          cp drivers/linux/60-ps3pad.rules dist/
          tar czf ps3pad-linux-udev.tar.gz -C dist 60-ps3pad.rules

      - name: Package Windows (native MSVC)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/ps3pad.exe dist/
          cp -r drivers/windows dist/ 2>/dev/null || true
          7z a ${{ matrix.artifact }} dist/*

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Installing Inno Setup 6..."
          winget install --id JRSoftware.InnoSetup --accept-package-agreements --accept-source-agreements
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Fetch the DsHidMini driver package (signed UMDF driver for the DS3)
          # before building the installer so the driver files are bundled.
          Write-Host "Fetching DsHidMini driver package..."
          & installer\windows\fetch-dshidmini.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $version = "${{ github.ref_name }}"
          if ($version -match '^v(.+)$') {
            $version = $Matches[1]
          } else {
            $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
              Where-Object name -eq 'ps3pad' |
              Select-Object -ExpandProperty version
          }
          Write-Host "Building PS3Pad installer $version"

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" |
              Select-Object -First 1).FullName
          }
          if (-not $iscc) {
            throw "ISCC.exe (Inno Setup) not found"
          }

          New-Item -ItemType Directory -Force dist | Out-Null
          & $iscc "/DMyAppVersion=$version" "installer\windows\ps3pad.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist

      - name: Package macOS individual targets + universal
        if: runner.os == 'macOS' && matrix.target == 'universal'
        run: |
          mkdir -p dist
          # Individual binaries
          cp target/x86_64-apple-darwin/release/ps3pad dist/ps3pad-x86_64
          cp target/aarch64-apple-darwin/release/ps3pad dist/ps3pad-aarch64
          tar czf ps3pad-macos-x86_64.tar.gz -C dist ps3pad-x86_64
          tar czf ps3pad-macos-aarch64.tar.gz -C dist ps3pad-aarch64
          # Universal binary
          lipo -create \
            target/x86_64-apple-darwin/release/ps3pad \
            target/aarch64-apple-darwin/release/ps3pad \
            -output dist/ps3pad-universal
          tar czf ${{ matrix.artifact }} -C dist ps3pad-universal

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            dist/ps3pad-windows-x86_64-setup.exe
            ps3pad-linux-udev.tar.gz
            ps3pad-macos-x86_64.tar.gz
            ps3pad-macos-aarch64.tar.gz
            ps3pad-macos-universal.tar.gz
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true