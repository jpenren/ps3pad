[workspace]
resolver = "2"
members = [
    "crates/ps3pad-core",
    "crates/ps3pad-platform",
    "crates/ps3pad",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["ps3pad contributors"]
repository = "https://github.com/ps3pad/ps3pad"
description = "Self-contained Sony DualShock 3 / SIXAXIS driver and tester for Linux, Windows and macOS"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
libc = "0.2"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
