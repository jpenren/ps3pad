<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="640" viewBox="0 0 1024 640">
  <rect width="1024" height="640" fill="#1e1e2e"/>
  <!-- Header bar -->
  <rect x="0" y="0" width="1024" height="40" fill="#282838"/>
  <text x="16" y="28" font-family="monospace" font-size="14" fill="#cdd6f4">ps3pad gui  •  Sony PLAYSTATION(R)3 Controller on /dev/hidraw0 (USB)  •  MAC e6:a8:9b:43:26:00</text>
  
  <!-- Left panel: Device info -->
  <rect x="16" y="56" width="280" height="180" rx="8" fill="#282838" stroke="#313244"/>
  <text x="32" y="84" font-family="monospace" font-size="13" fill="#cdd6f4" font-weight="bold">Device</text>
  <text x="32" y="112" font-family="monospace" font-size="12" fill="#a6adc8">Connection: USB</text>
  <text x="32" y="136" font-family="monospace" font-size="12" fill="#a6adc8">MAC: e6:a8:9b:43:26:00</text>
  <text x="32" y="160" font-family="monospace" font-size="12" fill="#a6adc8">Battery: 100% Full</text>
  <text x="32" y="184" font-family="monospace" font-size="12" fill="#a6adc8">Virtual Pad: ● Enabled</text>
  
  <!-- Center: Controller visualization -->
  <rect x="312" y="56" width="400" height="480" rx="8" fill="#282838" stroke="#313244"/>
  <!-- Controller body outline -->
  <ellipse cx="512" cy="296" rx="180" ry="140" fill="none" stroke="#45475a" stroke-width="3"/>
  <!-- Left stick -->
  <circle cx="372" cy="276" r="45" fill="#1e1e2e" stroke="#45475a" stroke-width="2"/>
  <circle cx="372" cy="276" r="20" fill="#89b4fa" opacity="0.3"/>
  <circle cx="380" cy="268" r="8" fill="#89b4fa"/>
  <!-- Right stick -->
  <circle cx="652" cy="276" r="45" fill="#1e1e2e" stroke="#45475a" stroke-width="2"/>
  <circle cx="652" cy="276" r="20" fill="#89b4fa" opacity="0.3"/>
  <circle cx="660" cy="268" r="8" fill="#89b4fa"/>
  <!-- D-pad -->
  <g transform="translate(372, 380)">
    <rect x="-12" y="-40" width="24" height="80" rx="4" fill="#1e1e2e" stroke="#45475a"/>
    <rect x="-40" y="-12" width="80" height="24" rx="4" fill="#1e1e2e" stroke="#45475a"/>
    <text x="0" y="-50" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6adc8">▲</text>
    <text x="0" y="55" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6adc8">▼</text>
    <text x="-50" y="5" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6adc8">◀</text>
    <text x="50" y="5" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6adc8">▶</text>
  </g>
  <!-- Face buttons -->
  <g transform="translate(652, 380)">
    <circle cx="0" cy="-40" r="18" fill="#1e1e2e" stroke="#45475a" stroke-width="2"/>
    <circle cx="0" cy="40" r="18" fill="#1e1e2e" stroke="#45475a" stroke-width="2"/>
    <circle cx="-40" cy="0" r="18" fill="#1e1e2e" stroke="#45475a" stroke-width="2"/>
    <circle cx="40" cy="0" r="18" fill="#1e1e2e" stroke="#45475a" stroke-width="2"/>
    <text x="0" cy="-40" text-anchor="middle" font-family="monospace" font-size="14" fill="#89b4fa">△</text>
    <text x="0" y="46" text-anchor="middle" font-family="monospace" font-size="14" fill="#f9e2af">✕</text>
    <text x="-40" y="6" text-anchor="middle" font-family="monospace" font-size="14" fill="#a6adc8">○</text>
    <text x="40" y="6" text-anchor="middle" font-family="monospace" font-size="14" fill="#f5c2e7">□</text>
  </g>
  <!-- Shoulder buttons -->
  <rect x="332" y="100" width="80" height="28" rx="6" fill="#1e1e2e" stroke="#45475a"/>
  <text x="372" y="120" text-anchor="middle" font-family="monospace" font-size="11" fill="#a6adc8">L1</text>
  <rect x="612" y="100" width="80" height="28" rx="6" fill="#1e1e2e" stroke="#45475a"/>
  <text x="652" y="120" text-anchor="middle" font-family="monospace" font-size="11" fill="#a6adc8">R1</text>
  <rect x="312" y="72" width="120" height="24" rx="4" fill="#1e1e2e" stroke="#45475a"/>
  <text x="372" y="89" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6adc8">L2 ████░░░░░░░░ 32%</text>
  <rect x="592" y="72" width="120" height="24" rx="4" fill="#1e1e2e" stroke="#45475a"/>
  <text x="652" y="89" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6adc8">R2 ░░░░░░░░░░ 0%</text>
  <!-- Select/Start/PS -->
  <circle cx="452" cy="180" r="12" fill="#1e1e2e" stroke="#45475a"/>
  <text x="452" y="185" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6adc8">⋯</text>
  <circle cx="572" cy="180" r="12" fill="#1e1e2e" stroke="#45475a"/>
  <text x="572" y="185" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6adc8">≡</text>
  <circle cx="512" cy="140" r="14" fill="#1e1e2e" stroke="#f38ba8" stroke-width="2"/>
  <text x="512" y="145" text-anchor="middle" font-family="monospace" font-size="12" fill="#f38ba8">●</text>
  
  <!-- Right panel: Motion & Controls -->
  <rect x="728" y="56" width="280" height="480" rx="8" fill="#282838" stroke="#313244"/>
  <!-- Accelerometer -->
  <text x="744" y="84" font-family="monospace" font-size="13" fill="#cdd6f4" font-weight="bold">Accelerometer (g)</text>
  <text x="744" y="112" font-family="monospace" font-size="12" fill="#a6adc8">X: +0.02</text>
  <rect x="744" y="116" width="120" height="8" rx="4" fill="#313244"/>
  <rect x="744" y="116" width="62" height="8" rx="4" fill="#89b4fa"/>
  <text x="744" y="140" font-family="monospace" font-size="12" fill="#a6adc8">Y: -0.01</text>
  <rect x="744" y="144" width="120" height="8" rx="4" fill="#313244"/>
  <rect x="744" y="144" width="58" height="8" rx="4" fill="#f9e2af"/>
  <text x="744" y="168" font-family="monospace" font-size="12" fill="#a6adc8">Z: +0.98</text>
  <rect x="744" y="172" width="120" height="8" rx="4" fill="#313244"/>
  <rect x="744" y="172" width="118" height="8" rx="4" fill="#a6e3a1"/>
  
  <!-- Tilt -->
  <text x="744" y="204" font-family="monospace" font-size="13" fill="#cdd6f4" font-weight="bold">Tilt (°)</text>
  <text x="744" y="232" font-family="monospace" font-size="12" fill="#a6adc8">Pitch: +0.5°</text>
  <text x="744" y="256" font-family="monospace" font-size="12" fill="#a6adc8">Roll:  -0.2°</text>
  
  <!-- Gyro -->
  <text x="744" y="288" font-family="monospace" font-size="13" fill="#cdd6f4" font-weight="bold">Gyro (raw)</text>
  <text x="744" y="316" font-family="monospace" font-size="12" fill="#a6adc8">Yaw: 1280</text>
  
  <!-- LED indicators -->
  <text x="744" y="356" font-family="monospace" font-size="13" fill="#cdd6f4" font-weight="bold">Player LED</text>
  <g transform="translate(744, 368)">
    <circle cx="20" cy="0" r="12" fill="#89b4fa"/>
    <text x="20" y="4" text-anchor="middle" font-family="monospace" font-size="10" fill="#1e1e2e">1</text>
    <circle cx="60" cy="0" r="12" fill="#313244" stroke="#45475a"/>
    <text x="60" y="4" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6adc8">2</text>
    <circle cx="100" cy="0" r="12" fill="#313244" stroke="#45475a"/>
    <text x="100" y="4" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6adc8">3</text>
    <circle cx="140" cy="0" r="12" fill="#313244" stroke="#45475a"/>
    <text x="140" y="4" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6adc8">4</text>
  </g>
  
  <!-- Rumble sliders -->
  <text x="744" y="416" font-family="monospace" font-size="13" fill="#cdd6f4" font-weight="bold">Rumble</text>
  <text x="744" y="444" font-family="monospace" font-size="12" fill="#a6adc8">Left (strong):  0%</text>
  <rect x="744" y="448" width="200" height="12" rx="6" fill="#313244"/>
  <text x="744" y="476" font-family="monospace" font-size="12" fill="#a6adc8">Right (weak):   0%</text>
  <rect x="744" y="480" width="200" height="12" rx="6" fill="#313244"/>
  
  <!-- Report log -->
  <text x="744" y="520" font-family="monospace" font-size="13" fill="#cdd6f4" font-weight="bold">Report Log</text>
  <rect x="744" y="528" width="248" height="88" rx="4" fill="#1e1e2e" stroke="#313244"/>
  <text x="756" y="548" font-family="monospace" font-size="10" fill="#a6adc8">[0.00s] USB btn: L+R L(0.02,-0.01)...</text>
  <text x="756" y="564" font-family="monospace" font-size="10" fill="#a6adc8">[0.02s] USB btn: L+R L(0.03,-0.01)...</text>
  <text x="756" y="580" font-family="monospace" font-size="10" fill="#a6adc8">[0.04s] USB btn: L+R L(0.02,+0.00)...</text>
  <text x="756" y="596" font-family="monospace" font-size="10" fill="#a6adc8">[0.06s] USB btn: L+R L(0.02,-0.01)...</text>
</svg>